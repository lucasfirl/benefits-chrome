name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run tests
        run: node test/run-all.js
      # Same archive CI builds: zipped from inside src/, so manifest.json sits
      # at the root of the ZIP, which is where Chrome expects it.
      - name: Build ZIP
        run: |
          v=$(node -p "require('./src/manifest.json').version")
          mkdir -p dist
          (cd src && zip -qr "../dist/cb-deal-finder-$v.zip" .)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release create "$TAG" dist/*.zip --title "$TAG" --generate-notes
