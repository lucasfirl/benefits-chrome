name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run tests
        run: node test/run-all.js

  package:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Build ZIP
        shell: pwsh
        run: ./package.ps1
      - name: Read version
        id: v
        shell: pwsh
        run: |
          $v = (Get-Content manifest.json -Raw | ConvertFrom-Json).version
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/upload-artifact@v5
        with:
          name: cb-deal-finder-${{ steps.v.outputs.version }}
          path: dist/*.zip
          if-no-files-found: error
