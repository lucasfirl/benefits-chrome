name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run tests
        run: node test/run-all.js

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Read version
        id: v
        run: echo "version=$(node -p "require('./src/manifest.json').version")" >> "$GITHUB_OUTPUT"
      # Zipped from inside src/ so that manifest.json lands at the archive root,
      # which is where Chrome expects it. src/ holds what ships and nothing else,
      # so there is nothing here to exclude.
      - name: Build ZIP
        run: |
          mkdir -p dist
          (cd src && zip -qr "../dist/cb-deal-finder-${{ steps.v.outputs.version }}.zip" .)
      - uses: actions/upload-artifact@v5
        with:
          name: cb-deal-finder-${{ steps.v.outputs.version }}
          path: dist/*.zip
          if-no-files-found: error
