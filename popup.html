<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>CB Deal Finder</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header id="topBar">
    <img src="icons/icon48.png" alt="" width="17" height="17">
    <span class="wordmark" data-i18n="popupWordmark">Deal Finder</span>
    <span id="siteHost" class="host"></span>
    <button id="settingsBtn" class="icon-btn" type="button" title="Settings" data-i18n-title="popupSettingsTitle" data-i18n-aria-label="popupSettingsTitle" aria-label="Settings">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path></svg>
    </button>
  </header>

  <div id="content">
    <p id="loading" class="placeholder" data-i18n="popupLoading">Checking this site…</p>
  </div>

  <form id="manualSearchForm" class="search" hidden>
    <div class="search-box">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <input id="manualSearchInput" type="text" placeholder="Search any brand" data-i18n-placeholder="popupSearchPlaceholder" autocomplete="off">
      <button id="manualSearchClear" class="icon-btn tight" type="button" hidden aria-label="Clear" data-i18n-aria-label="popupSearchClear">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
      </button>
    </div>
  </form>

  <div id="manualResults"></div>

  <!-- Automatisches Melden fuer genau diese Seite: an, bis Browserende aus,
       oder dauerhaft aus. -->
  <div id="autoBar" hidden>
    <div class="auto-row">
      <span id="autoBarLabel"></span>
      <div id="autoBarSeg" class="seg" role="group"></div>
    </div>
    <!-- Umfang: nur dieser Host oder die ganze Domain samt Unterseiten. -->
    <div class="auto-row">
      <span class="auto-scope-label" data-i18n="popupScopeLabel">Applies to</span>
      <div id="autoBarScope" class="seg scope" role="group"></div>
    </div>
  </div>

  <div id="catalogBar">
    <span id="catalogAge"></span>
    <button id="catalogRefresh" class="btn outline tiny" type="button"></button>
  </div>

  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
